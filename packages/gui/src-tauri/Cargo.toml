[package]
name = "keel-gui"
version = "0.0.0"
description = "Cliente GUI de Keel; transporte IPC sin lógica del daemon"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "net", "sync", "time", "rt"] }

# ADR-0005 §1 (revisión 2026-10-23): AF_UNIX en Windows; tokio no lo tiene allí.
[target.'cfg(windows)'.dependencies]
uds_windows = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "net", "sync", "time"] }
