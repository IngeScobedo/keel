name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - name: Las librerías cargan en Node (ADR-0007 §4)
        run: node --input-type=module -e "await import('./packages/git/dist/index.js')"
      - name: Renderer GUI
        run: bun run gui:build
      - name: Chromium para flujos GUI
        run: bunx playwright install --with-deps chromium
      - name: Flujos GUI y frontera IPC simulada
        run: bun run gui:e2e
      - run: bun run docs:lint
      - run: bun run docs:validate-ddl
      - name: Keel no toca archivos de credenciales (ADR-0002)
        run: |
          ! grep -rnE '\.claude\.json|\.codex/auth\.json|credentials\.json' packages spikes scripts --include='*.ts' --exclude-dir=node_modules --exclude-dir=__fixtures__ \
            | grep -v 'ADR-0002\|no lee\|nunca\|probe' || { echo "ruta de credenciales en código"; exit 1; }
