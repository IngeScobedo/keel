name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - name: Tokens al día y sin colores literales (ADR-0034 §1)
        run: bun run tokens:check
      - run: bun run typecheck
      - run: bun run test
      - name: Las librerías cargan en Node (ADR-0007 §4)
        run: node --input-type=module -e "await import('./packages/git/dist/index.js'); await import('./packages/git/dist/github/index.js')"
      - name: Renderer GUI
        run: bun run gui:build
      - name: Librerías de sistema para Tauri (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/gui/src-tauri
      - name: Shell de Tauri y su transporte contra el daemon real
        run: cargo test --locked --manifest-path packages/gui/src-tauri/Cargo.toml
      - name: Chromium para flujos GUI
        run: bunx playwright install --with-deps chromium
      - name: Flujos GUI y frontera IPC simulada
        run: bun run gui:e2e
      - run: bun run docs:lint
      - run: bun run docs:validate-ddl
      - name: Keel no toca archivos de credenciales (ADR-0002)
        run: |
          ! grep -rnE '\.claude\.json|\.codex/auth\.json|credentials\.json|gh/hosts\.yml' packages spikes scripts --include='*.ts' --exclude-dir=node_modules --exclude-dir=__fixtures__ \
            | grep -v 'ADR-0002\|no lee\|nunca\|probe' || { echo "ruta de credenciales en código"; exit 1; }

  # Windows nativo: lo que POSIX tapa (archivos abiertos, rutas C:/, CRLF, AF_UNIX con
  # ACL del perfil). Defectos reales encontrados así el 2026-10-23.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - name: Renderer GUI
        run: bun run gui:build
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/gui/src-tauri
      - name: Shell de Tauri y su transporte AF_UNIX contra el daemon real
        run: cargo test --locked --manifest-path packages/gui/src-tauri/Cargo.toml

